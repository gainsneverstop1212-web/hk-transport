<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="港住走">
<meta name="description" content="香港巴士、小巴、港鐵、輕鐵實時到站、路線搜尋、轉車規劃同出門倒數">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- 招牌字：只下載「港住走 RushingHK」呢幾個字（幾 KB） -->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Kaushan+Script&amp;text=%E6%B8%AF%E4%BD%8F%E8%B5%B0RushingHK&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<title>港住走 · 香港巴士港鐵出門倒數</title>
</head>
<body>
<header class="sign">
  <div class="wrap">
    <p class="brand" id="brand" role="img" aria-label="港住走 Rushing HK">
      <span class="logo" aria-hidden="true">
        <svg class="logo-bg" viewBox="0 0 132 52" preserveAspectRatio="none"><path class="logo-red" d="M2 15 9 11 16 13 12 42 4 45 0 38z"/><path class="logo-ink" d="M9 9 30 6 62 7 96 3 124 2 131 8 127 17 129 26 124 37 126 44 98 46 64 49 33 48 6 50 3 42 7 33 4 22 8 15z"/><path class="logo-swipe" d="M52 33.5 129 28.5 127 31 54 35.5z"/></svg>
        <span class="logo-zh"><b>港</b><i>住走</i></span>
        <span class="logo-en">Rushing <i>HK</i></span>
      </span>
    </p>
    <button class="lang" id="langBtn" type="button">EN</button>
    <div class="clock" id="clock" role="img" aria-label="現在時間"></div>
  </div>
</header>

<main>
  <div class="wrap alert-bar" id="alertBar" hidden role="region" aria-live="polite"></div>
  <div id="boot" class="wrap"><div class="hero">
    <div class="bigflap" aria-hidden="true"><span class="f">載</span><span class="f">入</span><span class="f">中</span></div>
    <h1 id="bootH">正在準備全港路線資料</h1>
    <p id="loadTxt">第一次開要下載約 8 MB；之後即開，路線資料會喺背景每日更新。</p>
  </div></div>
  <section class="view" id="v-near" hidden></section>
  <section class="view" id="v-route" hidden></section>
  <section class="view" id="v-plan" hidden></section>
  <section class="view" id="v-saved" hidden></section>
  <section class="view" id="v-news" hidden></section>
  <footer class="wrap foot" id="foot">到站時間來自運輸署 DATA.GOV.HK 及各營辦商開放數據，只供參考。路線整合：<a href="https://github.com/hkbus/hk-bus-crawling" target="_blank" rel="noopener">hkbus/hk-bus-crawling</a>；地圖及地址：地政總署、政府地址查詢服務。電車同紅色小巴暫時冇開放實時數據。</footer>
</main>

<nav class="tabs" id="tabs" aria-label="主選單"></nav>
<button class="trip-pill" id="tripPill" type="button" hidden></button>
<div class="trip" id="trip" hidden role="dialog" aria-modal="true" aria-label="出門倒數"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
